<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 40" shape-rendering="crispEdges" fill="#ffb000">
  <!-- MQ-9 side profile, nose left: sensor dome, hump, high wing, V-tail, pusher prop -->
  <!-- sensor dome (nose) -->
  <rect x="4" y="17" width="8" height="2" />
  <rect x="2" y="19" width="12" height="6" />
  <rect x="4" y="25" width="8" height="2" />
  <!-- fuselage -->
  <rect x="12" y="16" width="42" height="9" />
  <rect x="54" y="17" width="16" height="6" />
  <rect x="70" y="18" width="10" height="4" />
  <!-- SATCOM hump -->
  <rect x="16" y="10" width="12" height="7" />
  <!-- high wing (thin) -->
  <rect x="30" y="13" width="42" height="3" />
  <rect x="36" y="15" width="20" height="2" />
  <!-- upper tail fin -->
  <rect x="64" y="13" width="4" height="3" />
  <rect x="66" y="10" width="4" height="3" />
  <rect x="68" y="7" width="4" height="3" />
  <rect x="70" y="4" width="4" height="3" />
  <!-- lower ruddervator -->
  <rect x="64" y="24" width="4" height="3" />
  <rect x="66" y="27" width="4" height="3" />
  <rect x="68" y="30" width="4" height="3" />
  <!-- pusher prop + hub -->
  <rect x="78" y="18" width="4" height="4" />
  <rect x="82" y="6" width="3" height="28" />
</svg>
