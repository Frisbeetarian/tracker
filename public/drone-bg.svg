<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges" fill="#ffb000">
  <!-- MQ-9 top view, nose up: sensor dome, long wings, body, splayed V-tail -->
  <!-- nose / sensor dome -->
  <rect x="30" y="2" width="4" height="2" />
  <rect x="29" y="4" width="6" height="2" />
  <rect x="28" y="6" width="8" height="3" />
  <!-- forward avionics shoulders -->
  <rect x="27" y="12" width="10" height="9" />
  <!-- fuselage spine -->
  <rect x="29" y="9" width="6" height="41" />
  <!-- wing root (thicker where wings meet body) -->
  <rect x="23" y="21" width="18" height="7" />
  <!-- main wings: long, thin, high aspect ratio -->
  <rect x="2" y="23" width="60" height="3" />
  <!-- rear engine housing -->
  <rect x="26" y="40" width="12" height="10" />
  <!-- tail hub -->
  <rect x="30" y="49" width="4" height="4" />
  <!-- V-tail, left fin (stepped diagonal) -->
  <rect x="27" y="50" width="4" height="3" />
  <rect x="24" y="53" width="4" height="3" />
  <rect x="21" y="56" width="4" height="3" />
  <rect x="18" y="59" width="4" height="3" />
  <!-- V-tail, right fin (stepped diagonal) -->
  <rect x="33" y="50" width="4" height="3" />
  <rect x="36" y="53" width="4" height="3" />
  <rect x="39" y="56" width="4" height="3" />
  <rect x="42" y="59" width="4" height="3" />
</svg>
