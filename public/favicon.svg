<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="2" fill="#07070a" />
  <!-- MQ-9 top-view silhouette: needle fuselage, long high-aspect wings, tail -->
  <g fill="#ff2a2a" filter="url(#glow)">
    <rect x="7" y="0" width="2" height="14" />
    <rect x="1" y="5" width="14" height="2" />
    <rect x="4" y="12" width="8" height="2" />
  </g>
  <!-- green sensor / target-lock pixel -->
  <rect x="7" y="2" width="2" height="2" fill="#39ff14" filter="url(#glowg)" />
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#ff2a2a" flood-opacity="0.9" />
    </filter>
    <filter id="glowg" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.7" flood-color="#39ff14" flood-opacity="0.9" />
    </filter>
  </defs>
</svg>
